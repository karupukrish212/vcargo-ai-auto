[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vcargo-sql-agent"
version = "0.1.0"
description = "Read-only ERP SQL agent foundation and MySQL schema extraction"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "SQLAlchemy>=2.0.35,<2.1", "PyMySQL[rsa]>=1.1,<2",
  "PyYAML>=6.0.2,<7", "tzdata>=2024.2",
  "sqlglot>=30.23,<30.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2",
       "types-PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured test MySQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]
plugins = ["pydantic.mypy"]
