      unavailable to approved-query retrieval.
  - id: driver_licences_expiring
    question: 'Which active, non-cancelled drivers have licences expiring from today through 30 days from today, inclusive, using the current India date?'
    sql: |
      SELECT
        d.tdriverid,
        d.name,
        d.licensenumber,
        d.licenseexpiry,
        d.phone
      FROM tdriver AS d
      WHERE d.active = 1
        AND d.cancel = 0
        AND d.licenseexpiry >= DATE(UTC_TIMESTAMP() + INTERVAL 330 MINUTE)
        AND d.licenseexpiry <= DATE_ADD(
          DATE(UTC_TIMESTAMP() + INTERVAL 330 MINUTE), INTERVAL 30 DAY
        )
      ORDER BY d.licenseexpiry ASC, d.tdriverid ASC;
    related_tables: [tdriver]
    tags: [driver_licence_expiry, next_30_days, includes_today, india_timezone, dynamic_date]
    verified: false
    source: llm_generated
    reviewed_by: 'Karupu'
    reviewed_on: null
    notes: >-
