      SELECT
        c.customerid AS customer_id,
        c.customername,
        t.tripid,
        v.vehiclenumber,
        t.source,
        t.destination,
        t.tripstarttime,
        t.tripendtime,
        t.revenue AS trip_revenue,
        CASE WHEN t.revenue IS NULL THEN 1 ELSE 0 END AS revenue_missing_count
      FROM trip AS t
      INNER JOIN tvehicle AS v ON t.vehicle = v.tvehicleid
