  - id: freight_weight_by_route
    question: 'What total goods weight in kilograms was transported on freight trips from Madurai to Chennai last month, September 2026, and how many trips were there, using 20 October 2026 as the reference date?'
    sql: |
      SELECT
        COUNT(t.tripid) AS total_trips,
        SUM(t.goodsweight) AS total_weight_kg,
        COUNT(t.tripid) - COUNT(t.goodsweight) AS missing_weight_count
      FROM trip AS t
      WHERE t.active = 1
        AND t.cancel = 0
        AND t.triptype = 'freight'
        AND t.enddate >= '2026-09-01'
        AND t.enddate < '2026-10-01'
        AND LOWER(t.source) LIKE '%madurai%'
        AND LOWER(t.destination) LIKE '%chennai%';
