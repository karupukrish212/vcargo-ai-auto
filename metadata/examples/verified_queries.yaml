queries:
  - id: maintenance_cost_by_vehicle
    question: 'What was the stored maintenance cost and number of completed maintenance records for each vehicle last month, September 2026, using 20 October 2026 as the reference date?'
    sql: |
      SELECT
        v.tvehicleid AS vehicle_id,
        v.vehiclenumber,
        COUNT(m.maintenanceid) AS maintenance_count,
        SUM(m.totalcost) AS total_maintenance_cost,
        COUNT(m.maintenanceid) - COUNT(m.totalcost) AS missing_cost_count
      FROM maintenance AS m
      INNER JOIN tvehicle AS v ON m.vehicle = v.tvehicleid
      WHERE m.active = 1
        AND m.cancel = 0
        AND m.status = 'COMPLETED'
        AND m.completeddate >= '2026-09-01'
        AND m.completeddate < '2026-10-01'
      GROUP BY v.tvehicleid, v.vehiclenumber
      ORDER BY maintenance_count DESC, v.tvehicleid ASC;
    related_tables: [maintenance, tvehicle]
    tags: [maintenance, vehicle_grouping, stored_maintenance_cost, completion_date, missing_values, last_month, fixed_period_example]
    verified: false
    source: llm_generated
    reviewed_by: null
    reviewed_on: null
    notes: >-
      Corrected from the project owner maintenance query. The saved schema confirms
      maintenanceid as the primary key, completeddate as DATE, totalcost as DECIMAL,
      active/cancel as BIT, and maintenance.vehicle as a physical foreign key to
      tvehicle.tvehicleid. Reference date is 2026-10-20 in Asia/Kolkata; the fixed
      period is September 2026. Resolve bounds again for another request date.
      Apply the active, non-cancelled record convention to maintenance rows in this
      draft; add no vehicle flag filters. The owner confirmed the exact maintenance
      status code COMPLETED and INR as the currency for totalcost. The owner has
