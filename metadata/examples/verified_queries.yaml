      condition is valid for an inclusive date range. Preserve that meaning:
      include licences expiring today and on the date 30 days from today. This
      covers calendar dates with offsets 0 through 30, not exactly 30 distinct
      dates. For an India report date of 2026-10-20 the bounds are 2026-10-20 through
