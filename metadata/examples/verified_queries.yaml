  - id: freight_trip_details
    question: 'Show freight trips completed last month, September 2026, including goods type and weight in kilograms, using 20 October 2026 as the reference date.'
    sql: |
      SELECT
        t.tripid,
        t.source,
        t.destination,
        t.goodstype,
        t.goodsweight AS weight_kg,
        CASE WHEN t.goodsweight IS NULL THEN 1 ELSE 0 END AS weight_missing_count
      FROM trip AS t
      WHERE t.active = 1
        AND t.cancel = 0
        AND t.triptype = 'freight'
        AND t.enddate >= '2026-09-01'
        AND t.enddate < '2026-10-01'
      ORDER BY weight_kg DESC, t.tripid ASC;
    related_tables: [trip]
    tags: [freight, trip_details, goods_weight, actual_completion, missing_values, last_month, fixed_period_example]
