      the stored total for the maintenance record. These definitions are recorded
      in metadata/tables/maintenance.yaml. Count maintenance records, sum known
      stored INR totalcost values directly, and
      report missing costs separately. Do not recompute costs from maintenanceparts.
      Keep NULL sums when no known costs contribute. The supplied INNER JOIN
      excludes records without a matching vehicle. Group by vehicle ID and number,
      retain count-descending ordering, and use vehicle ID to break ties. The
